<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% assign desc = page.description | default: site.description %}
  <meta name="description" content="{{ desc | strip_html | strip }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ desc | strip_html | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.poster %}<meta property="og:image" content="{{ page.poster | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <main class="page">
    {{ content }}
  </main>
  <footer class="footer">
    <p>Les vidéos sont hébergées sur YouTube. Aucun contenu YouTube n'est chargé avant que vous cliquiez sur lecture. · <a href="{{ '/confidentialite/' | relative_url }}">Confidentialité</a></p>
  </footer>
</body>
</html>
